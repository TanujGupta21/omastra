<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <radialGradient id="crGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="65%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </radialGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-opacity="0.1"/>
    </filter>
  </defs>

  <rect width="1000" height="1000" fill="url(#crGrad)"/>

  <!-- Top Badge -->
  <rect x="330" y="45" width="340" height="38" rx="19" fill="#000000"/>
  <text x="500" y="69" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" letter-spacing="3" fill="#FFFFFF" text-anchor="middle">SCIENTIFIC DOSING PROTOCOL</text>

  <!-- Product Image Center -->
  <image href="/products/creatine.png" x="280" y="140" width="440" height="660" preserveAspectRatio="xMidYMid meet" filter="url(#softShadow)"/>

  <!-- Protocol Card Left -->
  <g transform="translate(60, 240)">
    <rect width="250" height="140" rx="16" fill="#FFFFFF" stroke="#000000" stroke-width="1.5" filter="url(#softShadow)"/>
    <rect x="20" y="20" width="60" height="24" rx="6" fill="#000000"/>
    <text x="50" y="36" font-family="-apple-system, sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle">PHASE 1</text>
    <text x="20" y="70" font-family="-apple-system, sans-serif" font-size="16" font-weight="900" fill="#000000">OPTIONAL LOADING</text>
    <text x="20" y="94" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#64748B">20g Daily (4x 5g scoops)</text>
    <text x="20" y="114" font-family="-apple-system, sans-serif" font-size="12" font-weight="500" fill="#94A3B8">Days 1–7 to saturate stores</text>
  </g>

  <!-- Protocol Card Right -->
  <g transform="translate(690, 240)">
    <rect width="250" height="140" rx="16" fill="#FFFFFF" stroke="#000000" stroke-width="1.5" filter="url(#softShadow)"/>
    <rect x="20" y="20" width="60" height="24" rx="6" fill="#000000"/>
    <text x="50" y="36" font-family="-apple-system, sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle">PHASE 2</text>
    <text x="20" y="70" font-family="-apple-system, sans-serif" font-size="16" font-weight="900" fill="#000000">MAINTENANCE</text>
    <text x="20" y="94" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#64748B">5g Daily (1 level scoop)</text>
    <text x="20" y="114" font-family="-apple-system, sans-serif" font-size="12" font-weight="500" fill="#94A3B8">Consistent daily intake</text>
  </g>

  <!-- Bottom Mesh Card Left -->
  <g transform="translate(60, 620)">
    <rect width="250" height="130" rx="16" fill="#FFFFFF" stroke="#000000" stroke-width="1.5" filter="url(#softShadow)"/>
    <text x="20" y="40" font-family="-apple-system, sans-serif" font-size="14" font-weight="800" fill="#000000">200-MESH GRIND</text>
    <text x="20" y="66" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#64748B">Instant Dissolving</text>
    <text x="20" y="90" font-family="-apple-system, sans-serif" font-size="12" font-weight="500" fill="#94A3B8">No gritty texture or residue in shaker</text>
  </g>

  <!-- Bottom Stack Card Right -->
  <g transform="translate(690, 620)">
    <rect width="250" height="130" rx="16" fill="#FFFFFF" stroke="#000000" stroke-width="1.5" filter="url(#softShadow)"/>
    <text x="20" y="40" font-family="-apple-system, sans-serif" font-size="14" font-weight="800" fill="#000000">ZERO TASTE</text>
    <text x="20" y="66" font-family="-apple-system, sans-serif" font-size="13" font-weight="600" fill="#64748B">Stacks With Anything</text>
    <text x="20" y="90" font-family="-apple-system, sans-serif" font-size="12" font-weight="500" fill="#94A3B8">Easily mixes with whey, juice or water</text>
  </g>

  <text x="500" y="940" font-family="-apple-system, sans-serif" font-size="13" font-weight="800" letter-spacing="3" fill="#000000" text-anchor="middle">OMASTRA PURE CREATINE — 100% UNFLAVOURED MONOHYDRATE</text>
</svg>
