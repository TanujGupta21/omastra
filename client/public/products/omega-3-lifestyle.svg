<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <radialGradient id="o3LifeGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#FFFBEB"/>
      <stop offset="100%" stop-color="#FEF3C7"/>
    </radialGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="24" stdDeviation="30" flood-opacity="0.14"/>
    </filter>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#F59E0B" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="1000" height="1000" fill="url(#o3LifeGrad)"/>
  <!-- Minimal White Marble Counter Surface -->
  <rect y="760" width="1000" height="240" fill="#F1ECE4"/>
  <line x1="0" y1="760" x2="1000" y2="760" stroke="#E2DACF" stroke-width="2"/>

  <!-- Glass Dish with Golden Softgels Left -->
  <g transform="translate(130, 520)" filter="url(#softShadow)">
    <ellipse cx="90" cy="160" rx="85" ry="32" fill="#FFFFFF" fill-opacity="0.9" stroke="#E2E8F0" stroke-width="2"/>
    <!-- Golden Softgel Capsules -->
    <g filter="url(#goldGlow)">
      <ellipse cx="65" cy="150" rx="26" ry="12" fill="#F59E0B" stroke="#D97706" stroke-width="1.5" transform="rotate(-20 65 150)"/>
      <ellipse cx="63" cy="148" rx="16" ry="4" fill="#FDE68A" fill-opacity="0.7" transform="rotate(-20 63 148)"/>

      <ellipse cx="105" cy="154" rx="26" ry="12" fill="#F59E0B" stroke="#D97706" stroke-width="1.5" transform="rotate(25 105 154)"/>
      <ellipse cx="107" cy="152" rx="16" ry="4" fill="#FDE68A" fill-opacity="0.7" transform="rotate(25 107 152)"/>

      <ellipse cx="85" cy="165" rx="25" ry="11" fill="#F59E0B" stroke="#D97706" stroke-width="1.5" transform="rotate(-5 85 165)"/>
      <ellipse cx="85" cy="163" rx="15" ry="4" fill="#FDE68A" fill-opacity="0.7" transform="rotate(-5 85 163)"/>
    </g>
    <text x="90" y="215" font-family="-apple-system, sans-serif" font-size="12" font-weight="800" fill="#92400E" text-anchor="middle">LEMON-COATED CAPSULES</text>
  </g>

  <!-- Bottle Product Packaging Center -->
  <image href="/products/omega-3.png" x="290" y="140" width="460" height="660" preserveAspectRatio="xMidYMid meet" filter="url(#softShadow)"/>

  <!-- Water Glass / Daily Routine Prop Right -->
  <g transform="translate(740, 500)">
    <rect x="25" y="40" width="120" height="210" rx="16" fill="#FFFFFF" fill-opacity="0.9" stroke="#CBD5E1" stroke-width="2" filter="url(#softShadow)"/>
    <path d="M 27,100 L 143,100 L 143,240 C 143,246 138,250 132,250 L 38,250 C 32,250 27,246 27,240 Z" fill="#E0F2FE" fill-opacity="0.5"/>
    <text x="85" y="175" font-family="-apple-system, sans-serif" font-size="11" font-weight="800" letter-spacing="1" fill="#0284C7" text-anchor="middle">PURE WATER</text>
    <text x="85" y="280" font-family="-apple-system, sans-serif" font-size="12" font-weight="800" fill="#0369A1" text-anchor="middle">1 SOFTGEL DAILY</text>
  </g>

  <!-- Top Pill -->
  <rect x="340" y="45" width="320" height="38" rx="19" fill="#000000"/>
  <text x="500" y="69" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" letter-spacing="3" fill="#FFFFFF" text-anchor="middle">DAILY CELLULAR WELLNESS</text>

  <text x="500" y="940" font-family="-apple-system, sans-serif" font-size="13" font-weight="800" letter-spacing="3" fill="#000000" text-anchor="middle">550mg EPA · 350mg DHA · NO FISHY AFTERTASTE · HEART &amp; JOINT SUPPORT</text>
</svg>
