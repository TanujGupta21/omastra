  <text x="500" y="940" font-family="-apple-system, sans-serif" font-size="13" font-weight="800" letter-spacing="3" fill="#000000" text-anchor="middle">OMASTRA HYDROCHARGE — INTRA &amp; POST WORKOUT RECOVERY</text>
