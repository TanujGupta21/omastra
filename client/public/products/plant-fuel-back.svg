<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="20" stdDeviation="30" flood-opacity="0.1"/>
    </filter>
  </defs>

  <rect width="1000" height="1000" fill="#F8FAFC"/>

  <!-- Main Card -->
  <rect x="220" y="80" width="560" height="840" rx="20" fill="#FFFFFF" stroke="#000000" stroke-width="2" filter="url(#cardShadow)"/>

  <!-- Header -->
  <text x="500" y="140" font-family="-apple-system, sans-serif" font-size="28" font-weight="900" letter-spacing="2" fill="#000000" text-anchor="middle">OMASTRA</text>
  <text x="500" y="170" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" letter-spacing="3" fill="#64748B" text-anchor="middle">PLANT FUEL — NUTRITION FACTS</text>
  <line x1="250" y1="190" x2="750" y2="190" stroke="#000000" stroke-width="8"/>

  <!-- Serving Info -->
  <text x="260" y="220" font-family="-apple-system, sans-serif" font-size="16" font-weight="700" fill="#000000">Serving Size: 1 Scoop (36g)</text>
  <text x="260" y="244" font-family="-apple-system, sans-serif" font-size="15" font-weight="500" fill="#64748B">Servings Per Container: 28</text>
  <line x1="250" y1="260" x2="750" y2="260" stroke="#000000" stroke-width="4"/>

  <!-- Calories -->
  <text x="260" y="295" font-family="-apple-system, sans-serif" font-size="18" font-weight="800" fill="#000000">Calories: 130</text>
  <text x="740" y="295" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" fill="#64748B" text-anchor="end">Calories from Fat: 22</text>
  <line x1="250" y1="315" x2="750" y2="315" stroke="#000000" stroke-width="3"/>

  <!-- Macro Rows -->
  <g font-family="-apple-system, sans-serif" font-size="15">
    <text x="260" y="345" font-weight="800" fill="#000000">Total Fat 2.5g</text>
    <text x="740" y="345" font-weight="700" fill="#000000" text-anchor="end">3%</text>
    <line x1="250" y1="360" x2="750" y2="360" stroke="#E2E8F0" stroke-width="1"/>

    <text x="280" y="385" font-weight="500" fill="#64748B">Saturated Fat 0.5g</text>
    <text x="740" y="385" font-weight="600" fill="#64748B" text-anchor="end">2%</text>
    <line x1="250" y1="400" x2="750" y2="400" stroke="#E2E8F0" stroke-width="1"/>

    <text x="260" y="425" font-weight="800" fill="#000000">Total Carbohydrate 4g</text>
    <text x="740" y="425" font-weight="700" fill="#000000" text-anchor="end">1%</text>
    <line x1="250" y1="440" x2="750" y2="440" stroke="#E2E8F0" stroke-width="1"/>

    <text x="280" y="465" font-weight="500" fill="#64748B">Dietary Fiber 3g</text>
    <text x="740" y="465" font-weight="600" fill="#64748B" text-anchor="end">11%</text>
    <line x1="250" y1="480" x2="750" y2="480" stroke="#E2E8F0" stroke-width="1"/>

    <text x="280" y="505" font-weight="500" fill="#64748B">Total Sugars 0.5g (Added Sugars 0g)</text>
    <text x="740" y="505" font-weight="600" fill="#64748B" text-anchor="end">0%</text>
    <line x1="250" y1="520" x2="750" y2="520" stroke="#000000" stroke-width="3"/>

    <!-- Protein Big Highlight -->
    <text x="260" y="555" font-weight="900" font-size="18" fill="#000000">PROTEIN 22g</text>
    <text x="740" y="555" font-weight="800" font-size="16" fill="#000000" text-anchor="end">44%</text>
    <line x1="250" y1="575" x2="750" y2="575" stroke="#000000" stroke-width="6"/>

    <text x="260" y="605" font-weight="700" fill="#000000">Sodium 180mg</text>
    <text x="740" y="605" font-weight="700" fill="#000000" text-anchor="end">8%</text>
    <line x1="250" y1="620" x2="750" y2="620" stroke="#E2E8F0" stroke-width="1"/>

    <text x="260" y="645" font-weight="700" fill="#000000">Potassium 150mg</text>
    <text x="740" y="645" font-weight="700" fill="#000000" text-anchor="end">4%</text>
    <line x1="250" y1="660" x2="750" y2="660" stroke="#E2E8F0" stroke-width="1"/>

    <text x="260" y="685" font-weight="700" fill="#000000">Iron 4.5mg</text>
    <text x="740" y="685" font-weight="700" fill="#000000" text-anchor="end">25%</text>
  </g>
  <line x1="250" y1="705" x2="750" y2="705" stroke="#000000" stroke-width="4"/>

  <!-- Ingredients Block -->
  <text x="260" y="735" font-family="-apple-system, sans-serif" font-size="12" font-weight="800" fill="#000000">INGREDIENTS:</text>
  <text x="260" y="755" font-family="-apple-system, sans-serif" font-size="11" font-weight="500" fill="#475569">Pea Protein Isolate (85%), Sprouted Brown Rice Protein, Raw Cacao,</text>
  <text x="260" y="773" font-family="-apple-system, sans-serif" font-size="11" font-weight="500" fill="#475569">MCT Coconut Oil, Natural Flavors, Stevia Leaf Extract, DigeZyme®.</text>

  <text x="260" y="805" font-family="-apple-system, sans-serif" font-size="12" font-weight="800" fill="#000000">DIRECTIONS FOR USE:</text>
  <text x="260" y="825" font-family="-apple-system, sans-serif" font-size="11" font-weight="500" fill="#475569">Mix 1 scoop (36g) in 250ml water, almond milk, or your favorite smoothie.</text>
  <text x="260" y="845" font-family="-apple-system, sans-serif" font-size="11" font-weight="500" fill="#475569">Drink within 30 minutes of working out or enjoy as a protein-rich meal.</text>

  <!-- Bottom Badges -->
  <rect x="260" y="870" width="80" height="24" rx="12" fill="#000000"/>
  <text x="300" y="886" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">VEGAN</text>

  <rect x="350" y="870" width="100" height="24" rx="12" fill="#000000"/>
  <text x="400" y="886" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">GLUTEN FREE</text>

  <rect x="460" y="870" width="100" height="24" rx="12" fill="#000000"/>
  <text x="510" y="886" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">DAIRY FREE</text>
</svg>
