<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <linearGradient id="warmBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#FBFBF9"/>
      <stop offset="100%" stop-color="#F0EDE6"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="24" stdDeviation="32" flood-opacity="0.14"/>
    </filter>
    <filter id="glassShade" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1000" height="1000" fill="url(#warmBg)"/>
  <!-- Marble Counter Base -->
  <rect y="760" width="1000" height="240" fill="#EAE7DF"/>
  <line x1="0" y1="760" x2="1000" y2="760" stroke="#DDD7CB" stroke-width="2"/>

  <!-- Shaker Glass Prop Left -->
  <g transform="translate(140, 480)" filter="url(#glassShade)">
    <rect x="20" y="40" width="120" height="260" rx="20" fill="#FFFFFF" fill-opacity="0.85" stroke="#CBD5E1" stroke-width="2"/>
    <path d="M 22,120 L 138,120 L 138,290 C 138,296 132,300 126,300 L 34,300 C 28,300 22,296 22,290 Z" fill="#F1ECE1"/>
    <rect x="10" y="20" width="140" height="30" rx="8" fill="#1E293B"/>
    <rect x="65" y="0" width="30" height="24" rx="4" fill="#0F172A"/>
    <text x="80" y="210" font-family="-apple-system, sans-serif" font-size="11" font-weight="800" letter-spacing="2" fill="#94A3B8" text-anchor="middle">OMASTRA</text>
  </g>

  <!-- Central Pouch -->
  <image href="/products/plant-fuel.png" x="310" y="140" width="450" height="660" preserveAspectRatio="xMidYMid meet" filter="url(#softShadow)"/>

  <!-- Raw Ingredients Aesthetic Dish Right -->
  <g transform="translate(740, 560)" filter="url(#glassShade)">
    <ellipse cx="90" cy="180" rx="90" ry="32" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    <ellipse cx="90" cy="176" rx="76" ry="24" fill="#D97706" fill-opacity="0.25"/>
    <!-- Almonds & Pods illustration -->
    <ellipse cx="65" cy="170" rx="14" ry="8" fill="#B45309" transform="rotate(-20 65 170)"/>
    <ellipse cx="95" cy="172" rx="15" ry="9" fill="#92400E" transform="rotate(15 95 172)"/>
    <ellipse cx="118" cy="168" rx="13" ry="8" fill="#B45309" transform="rotate(-35 118 168)"/>
    <text x="90" y="235" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="1" fill="#64748B" text-anchor="middle">CLEAN PLANT MATRICES</text>
  </g>

  <!-- Tag Pill -->
  <rect x="360" y="45" width="280" height="38" rx="19" fill="#000000"/>
  <text x="500" y="69" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" letter-spacing="3" fill="#FFFFFF" text-anchor="middle">LIFESTYLE &amp; DAILY USAGE</text>
  
  <text x="500" y="940" font-family="-apple-system, sans-serif" font-size="13" font-weight="800" letter-spacing="3" fill="#000000" text-anchor="middle">SMOOTH TASTE · INSTANT MIXING WITH WATER OR PLANT MILK</text>
</svg>
