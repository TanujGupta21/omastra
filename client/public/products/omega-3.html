<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Anton&family=Manrope:wght@400;600;700;800;900&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1024px;
    height: 1024px;
    overflow: hidden;
    background: #070d18;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Manrope', sans-serif;
  }
  svg {
    width: 1024px;
    height: 1024px;
  }
</style>
</head>
<body>
<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="46%" r="65%">
      <stop offset="0%" stop-color="#142852"/>
      <stop offset="45%" stop-color="#0a152d"/>
      <stop offset="80%" stop-color="#070d18"/>
      <stop offset="100%" stop-color="#04070d"/>
    </radialGradient>

    <!-- Studio Rim Light Glow -->
    <radialGradient id="rimGlowLeft" cx="20%" cy="45%" r="35%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#070d18" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rimGlowRight" cx="80%" cy="45%" r="35%">
      <stop offset="0%" stop-color="#67e8f9" stop-opacity="0.25"/>
      <stop offset="70%" stop-color="#070d18" stop-opacity="0"/>
    </radialGradient>

    <!-- Floor Pedestal Reflection -->
    <radialGradient id="pedestalGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.5"/>
      <stop offset="40%" stop-color="#0e234e" stop-opacity="0.3"/>
      <stop offset="90%" stop-color="#070d18" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pedestalRim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0"/>
      <stop offset="30%" stop-color="#67e8f9" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#93c5fd" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#67e8f9" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0"/>
    </linearGradient>

    <!-- Bottle Amber Glass Cylindrical Gradient -->
    <linearGradient id="bottleBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#120c08"/>
      <stop offset="10%" stop-color="#2d1709"/>
      <stop offset="25%" stop-color="#4a260f"/>
      <stop offset="38%" stop-color="#9a4d1b"/>
      <stop offset="45%" stop-color="#633112"/>
      <stop offset="70%" stop-color="#2a150a"/>
      <stop offset="88%" stop-color="#4e250f"/>
      <stop offset="96%" stop-color="#241107"/>
      <stop offset="100%" stop-color="#0d0704"/>
    </linearGradient>

    <!-- Bottle Glass Specular Reflection Streak -->
    <linearGradient id="glassStreak" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Electric Cobalt Cap Gradient -->
    <linearGradient id="capMetallic" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f1d38"/>
      <stop offset="15%" stop-color="#1d4ed8"/>
      <stop offset="35%" stop-color="#60a5fa"/>
      <stop offset="48%" stop-color="#93c5fd"/>
      <stop offset="55%" stop-color="#3b82f6"/>
      <stop offset="80%" stop-color="#1e3a8a"/>
      <stop offset="95%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#0c1830"/>
    </linearGradient>

    <!-- Cap Top Bevel Gradient -->
    <linearGradient id="capTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="50%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Label Background Gradient -->
    <linearGradient id="labelBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#060c18"/>
      <stop offset="15%" stop-color="#0a162b"/>
      <stop offset="50%" stop-color="#0d1f3d"/>
      <stop offset="85%" stop-color="#0a162b"/>
      <stop offset="100%" stop-color="#060c18"/>
    </linearGradient>

    <!-- Cobalt Accent Bar -->
    <linearGradient id="accentBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="50%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>

    <!-- Softgel Amber Gradient -->
    <radialGradient id="softgel1" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="25%" stop-color="#f59e0b"/>
      <stop offset="60%" stop-color="#d97706"/>
      <stop offset="85%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#451a03"/>
    </radialGradient>
    <radialGradient id="softgel2" cx="30%" cy="25%" r="70%">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="20%" stop-color="#fbbf24"/>
      <stop offset="55%" stop-color="#ea580c"/>
      <stop offset="85%" stop-color="#9a3412"/>
      <stop offset="100%" stop-color="#431407"/>
    </radialGradient>

    <!-- Softgel Specular Highlight -->
    <linearGradient id="softgelSpec" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Shadows -->
    <filter id="softDropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="floorShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <filter id="glowFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- BACKGROUND -->
  <rect width="1024" height="1024" fill="url(#bgGlow)"/>
  <rect width="1024" height="1024" fill="url(#rimGlowLeft)"/>
  <rect width="1024" height="1024" fill="url(#rimGlowRight)"/>

  <!-- STUDIO PEDESTAL / BASE -->
  <ellipse cx="512" cy="830" rx="360" ry="85" fill="#000000" opacity="0.75" filter="url(#floorShadow)"/>
  <ellipse cx="512" cy="820" rx="340" ry="70" fill="url(#pedestalGlow)"/>
  <path d="M 180 810 A 332 68 0 0 0 844 810" fill="none" stroke="url(#pedestalRim)" stroke-width="4" opacity="0.8" filter="url(#glowFilter)"/>

  <!-- BOTTLE SHADOW ON FLOOR -->
  <ellipse cx="512" cy="790" rx="190" ry="38" fill="#02050a" opacity="0.9" filter="url(#floorShadow)"/>

  <!-- BOTTLE BODY (3D Cylindrical Amber Bottle) -->
  <g id="bottle">
    <!-- Base Rounded Bottom -->
    <rect x="342" y="360" width="340" height="410" rx="42" fill="url(#bottleBody)"/>
    <ellipse cx="512" cy="765" rx="170" ry="24" fill="url(#bottleBody)"/>

    <!-- Bottle Neck -->
    <path d="M 432 360 C 432 320 448 300 454 285 L 570 285 C 576 300 592 320 592 360 Z" fill="url(#bottleBody)"/>

    <!-- Glass Specular Highlight Overlay -->
    <rect x="342" y="360" width="340" height="410" rx="42" fill="url(#glassStreak)"/>

    <!-- Left & Right Rim Light Reflexes -->
    <path d="M 346 400 L 346 730" stroke="#3b82f6" stroke-width="5" stroke-linecap="round" opacity="0.7" filter="url(#glowFilter)"/>
    <path d="M 678 400 L 678 730" stroke="#67e8f9" stroke-width="4" stroke-linecap="round" opacity="0.55" filter="url(#glowFilter)"/>

    <!-- BOTTLE LABEL -->
    <g id="label">
      <!-- Label Body -->
      <rect x="347" y="420" width="330" height="295" fill="url(#labelBg)"/>
      <rect x="347" y="420" width="330" height="295" stroke="#1e293b" stroke-width="1.5" fill="none"/>

      <!-- Label Top Accent Line -->
      <rect x="357" y="426" width="310" height="3" fill="url(#accentBlue)"/>

      <!-- OMASTRA BRAND MONOGRAM & LOGO -->
      <g transform="translate(512, 452)" text-anchor="middle">
        <!-- Minimal geometric icon -->
        <polygon points="-12,-8 12,-8 0,6" fill="#67e8f9" opacity="0.9"/>
        <polygon points="-8,-4 8,-4 0,6" fill="#2563eb"/>
      </g>
      <text x="512" y="492" text-anchor="middle" font-family="'Anton', sans-serif" font-size="44" letter-spacing="4" fill="#f8fafc">OMASTRA</text>
      <text x="512" y="508" text-anchor="middle" font-family="'Manrope', sans-serif" font-weight="800" font-size="10" letter-spacing="4" fill="#67e8f9">PERFORMANCE NUTRITION</text>

      <!-- Divider -->
      <line x1="392" y1="522" x2="632" y2="522" stroke="#334155" stroke-width="1"/>

      <!-- PRODUCT NAME -->
      <text x="512" y="556" text-anchor="middle" font-family="'Anton', sans-serif" font-size="30" letter-spacing="2" fill="#ffffff">DAILY OMEGA-3 + D3</text>
      <text x="512" y="576" text-anchor="middle" font-family="'Manrope', sans-serif" font-weight="700" font-size="12" letter-spacing="2.5" fill="#38bdf8">TRIPLE STRENGTH FISH OIL</text>

      <!-- SPEC BADGES CONTAINER -->
      <g transform="translate(372, 595)">
        <!-- Badge 1: EPA / DHA -->
        <rect x="0" y="0" width="86" height="42" rx="6" fill="#0f172a" stroke="#2563eb" stroke-width="1.2"/>
        <text x="43" y="19" text-anchor="middle" font-family="'Anton', sans-serif" font-size="16" fill="#67e8f9">1000mg</text>
        <text x="43" y="32" text-anchor="middle" font-family="'Manrope', sans-serif" font-weight="800" font-size="8" fill="#94a3b8">EPA + DHA</text>

        <!-- Badge 2: VITAMIN D3 -->
        <rect x="97" y="0" width="86" height="42" rx="6" fill="#0f172a" stroke="#2563eb" stroke-width="1.2"/>
        <text x="140" y="19" text-anchor="middle" font-family="'Anton', sans-serif" font-size="16" fill="#67e8f9">1000 IU</text>
        <text x="140" y="32" text-anchor="middle" font-family="'Manrope', sans-serif" font-weight="800" font-size="8" fill="#94a3b8">VITAMIN D3</text>

        <!-- Badge 3: ENTERIC -->
        <rect x="194" y="0" width="86" height="42" rx="6" fill="#0f172a" stroke="#2563eb" stroke-width="1.2"/>
        <text x="237" y="19" text-anchor="middle" font-family="'Anton', sans-serif" font-size="16" fill="#67e8f9">60 SOFTGELS</text>
        <text x="237" y="32" text-anchor="middle" font-family="'Manrope', sans-serif" font-weight="800" font-size="8" fill="#94a3b8">BURP-LESS</text>
      </g>

      <!-- PURITY BADGE / FOOTER -->
      <g transform="translate(512, 672)" text-anchor="middle">
        <text font-family="'Manrope', sans-serif" font-weight="800" font-size="9" letter-spacing="2" fill="#cbd5e1">MOLECULARLY DISTILLED • MERCURY FREE</text>
        <text y="18" font-family="'Manrope', sans-serif" font-weight="600" font-size="8" letter-spacing="1.5" fill="#64748b">NATURAL LEMON FLAVOUR • DIETARY SUPPLEMENT</text>
      </g>

      <!-- Label Bottom Accent Line -->
      <rect x="357" y="707" width="310" height="3" fill="url(#accentBlue)"/>
    </g>

    <!-- METALLIC COBALT CAP -->
    <g id="cap">
      <!-- Cap Base Neck Lip -->
      <ellipse cx="512" cy="285" rx="64" ry="12" fill="#1e3a8a"/>

      <!-- Cap Ribbed Cylinder -->
      <rect x="448" y="210" width="128" height="75" rx="8" fill="url(#capMetallic)"/>

      <!-- Cap Rib Ridges (Gives tactile 3D grip effect) -->
      <g stroke="#0f172a" stroke-width="1.5" opacity="0.6">
        <line x1="458" y1="216" x2="458" y2="280"/>
        <line x1="468" y1="216" x2="468" y2="280"/>
        <line x1="478" y1="216" x2="478" y2="280"/>
        <line x1="488" y1="216" x2="488" y2="280"/>
        <line x1="498" y1="216" x2="498" y2="280"/>
        <line x1="508" y1="216" x2="508" y2="280"/>
        <line x1="518" y1="216" x2="518" y2="280"/>
        <line x1="528" y1="216" x2="528" y2="280"/>
        <line x1="538" y1="216" x2="538" y2="280"/>
        <line x1="548" y1="216" x2="548" y2="280"/>
        <line x1="558" y1="216" x2="558" y2="280"/>
        <line x1="568" y1="216" x2="568" y2="280"/>
      </g>
      <!-- Cap Highlights -->
      <line x1="486" y1="212" x2="486" y2="282" stroke="#ffffff" stroke-width="3" opacity="0.4"/>
      <line x1="538" y1="212" x2="538" y2="282" stroke="#67e8f9" stroke-width="2" opacity="0.7"/>

      <!-- Cap Top Beveled Rim -->
      <ellipse cx="512" cy="212" rx="64" ry="14" fill="url(#capTop)"/>
      <ellipse cx="512" cy="211" rx="58" ry="11" fill="none" stroke="#60a5fa" stroke-width="1.5" opacity="0.8"/>
    </g>
  </g>

  <!-- SOFTGEL CAPSULES (Laying luxuriously in front) -->
  <g id="softgels">
    <!-- Softgel 1 (Foreground Right, tilted) -->
    <g transform="translate(560, 755) rotate(18)">
      <!-- Drop Shadow -->
      <ellipse cx="2" cy="18" rx="44" ry="12" fill="#010408" opacity="0.85" filter="url(#softDropShadow)"/>
      <!-- Softgel Body -->
      <rect x="-42" y="-18" width="84" height="36" rx="18" fill="url(#softgel1)"/>
      <!-- Internal Glow refraction -->
      <ellipse cx="-10" cy="2" rx="28" ry="10" fill="#fef08a" opacity="0.6"/>
      <!-- Specular Highlight Strip -->
      <path d="M -30 -11 Q 0 -15 30 -11" stroke="url(#softgelSpec)" stroke-width="4.5" stroke-linecap="round" fill="none"/>
      <!-- Secondary Accent Reflection -->
      <ellipse cx="20" cy="7" rx="10" ry="4" fill="#ffffff" opacity="0.4"/>
      <ellipse cx="-24" cy="4" rx="8" ry="4" fill="#67e8f9" opacity="0.5"/>
    </g>

    <!-- Softgel 2 (Foreground Left, tilted opposite) -->
    <g transform="translate(420, 770) rotate(-22)">
      <!-- Drop Shadow -->
      <ellipse cx="2" cy="16" rx="42" ry="11" fill="#010408" opacity="0.85" filter="url(#softDropShadow)"/>
      <!-- Body -->
      <rect x="-40" y="-17" width="80" height="34" rx="17" fill="url(#softgel2)"/>
      <!-- Internal Glow refraction -->
      <ellipse cx="-8" cy="2" rx="26" ry="9" fill="#fef9c3" opacity="0.65"/>
      <!-- Highlight -->
      <path d="M -28 -10 Q 0 -14 28 -10" stroke="url(#softgelSpec)" stroke-width="4.5" stroke-linecap="round" fill="none"/>
      <ellipse cx="18" cy="6" rx="9" ry="3.5" fill="#ffffff" opacity="0.4"/>
      <ellipse cx="-22" cy="3" rx="7" ry="3" fill="#3b82f6" opacity="0.5"/>
    </g>

    <!-- Softgel 3 (Center, propped up) -->
    <g transform="translate(488, 792) rotate(-2)">
      <!-- Drop Shadow -->
      <ellipse cx="2" cy="17" rx="46" ry="12" fill="#010408" opacity="0.9" filter="url(#softDropShadow)"/>
      <!-- Body -->
      <rect x="-44" y="-19" width="88" height="38" rx="19" fill="url(#softgel1)"/>
      <!-- Internal glow -->
      <ellipse cx="-6" cy="3" rx="30" ry="11" fill="#fef08a" opacity="0.7"/>
      <!-- Highlight -->
      <path d="M -32 -12 Q 0 -16 32 -12" stroke="url(#softgelSpec)" stroke-width="5" stroke-linecap="round" fill="none"/>
      <ellipse cx="22" cy="7" rx="11" ry="4" fill="#ffffff" opacity="0.5"/>
      <ellipse cx="-26" cy="5" rx="8" ry="4" fill="#67e8f9" opacity="0.6"/>
    </g>
  </g>

  <!-- LIGHTING ATMOSPHERE OVERLAY -->
  <circle cx="512" cy="200" r="140" fill="#2563eb" opacity="0.12" filter="url(#floorShadow)"/>
  <circle cx="280" cy="500" r="160" fill="#2563eb" opacity="0.1" filter="url(#floorShadow)"/>
  <circle cx="740" cy="520" r="140" fill="#67e8f9" opacity="0.1" filter="url(#floorShadow)"/>
</svg>
</body>
</html>
