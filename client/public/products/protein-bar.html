<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Anton&family=Manrope:wght@400;600;700;800;900&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1024px;
    height: 1024px;
    overflow: hidden;
    background: #070d18;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Manrope', sans-serif;
  }
  svg {
    width: 1024px;
    height: 1024px;
  }
</style>
</head>
<body>
<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#142852"/>
      <stop offset="40%" stop-color="#0a152d"/>
      <stop offset="80%" stop-color="#070d18"/>
      <stop offset="100%" stop-color="#04070d"/>
    </radialGradient>

    <!-- Cobalt Studio Lighting -->
    <radialGradient id="rimGlowCobalt" cx="30%" cy="40%" r="40%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.32"/>
      <stop offset="70%" stop-color="#070d18" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rimGlowIce" cx="75%" cy="45%" r="40%">
      <stop offset="0%" stop-color="#67e8f9" stop-opacity="0.22"/>
      <stop offset="70%" stop-color="#070d18" stop-opacity="0"/>
    </radialGradient>

    <!-- Studio Floor Reflection -->
    <radialGradient id="floorReflection" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.45"/>
      <stop offset="45%" stop-color="#0f2249" stop-opacity="0.25"/>
      <stop offset="90%" stop-color="#070d18" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="pedestalLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0"/>
      <stop offset="35%" stop-color="#67e8f9" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#93c5fd" stop-opacity="0.85"/>
      <stop offset="65%" stop-color="#67e8f9" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0"/>
    </linearGradient>

    <!-- Foil Wrapper Gradient -->
    <linearGradient id="wrapperFoil" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#081020"/>
      <stop offset="20%" stop-color="#0e1f3d"/>
      <stop offset="40%" stop-color="#1e3a8a"/>
      <stop offset="52%" stop-color="#2563eb"/>
      <stop offset="60%" stop-color="#1d4ed8"/>
      <stop offset="80%" stop-color="#0c172e"/>
      <stop offset="100%" stop-color="#060c18"/>
    </linearGradient>

    <!-- Foil Metallic Sheen Angle -->
    <linearGradient id="foilSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="45%" stop-color="#93c5fd" stop-opacity="0.3"/>
      <stop offset="55%" stop-color="#67e8f9" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Chocolate Bar Top Surface -->
    <linearGradient id="chocTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2e1910"/>
      <stop offset="40%" stop-color="#3d2116"/>
      <stop offset="70%" stop-color="#28140b"/>
      <stop offset="100%" stop-color="#1a0b06"/>
    </linearGradient>

    <!-- Chocolate Bar Side Shadow -->
    <linearGradient id="chocSide" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#321a11"/>
      <stop offset="50%" stop-color="#24110a"/>
      <stop offset="100%" stop-color="#120603"/>
    </linearGradient>

    <!-- Chocolate Cross Section (Fudge + Crispies Core) -->
    <linearGradient id="coreCrossSection" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a2a1b"/>
      <stop offset="35%" stop-color="#5a3422"/>
      <stop offset="70%" stop-color="#3e2013"/>
      <stop offset="100%" stop-color="#2c1409"/>
    </linearGradient>

    <!-- Caramel Layer Gradient -->
    <linearGradient id="caramelLayer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>

    <!-- Chocolate Drizzle Gloss -->
    <linearGradient id="drizzleGloss" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3e1f13"/>
      <stop offset="35%" stop-color="#78350f"/>
      <stop offset="55%" stop-color="#502410"/>
      <stop offset="100%" stop-color="#220e06"/>
    </linearGradient>

    <!-- Filter Shadows -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="floorShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="crispGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- BACKGROUND -->
  <rect width="1024" height="1024" fill="url(#bgGlow)"/>
  <rect width="1024" height="1024" fill="url(#rimGlowCobalt)"/>
  <rect width="1024" height="1024" fill="url(#rimGlowIce)"/>

  <!-- STUDIO BASE / FLOOR -->
  <ellipse cx="512" cy="840" rx="380" ry="80" fill="#000000" opacity="0.8" filter="url(#floorShadow)"/>
  <ellipse cx="512" cy="830" rx="350" ry="65" fill="url(#floorReflection)"/>
  <path d="M 170 820 A 345 62 0 0 0 854 820" fill="none" stroke="url(#pedestalLine)" stroke-width="3.5" opacity="0.8" filter="url(#crispGlow)"/>

  <!-- WRAPPER (Angled in background, high-end metallic foil packaging) -->
  <g id="wrapper" transform="translate(180, 200) rotate(-14)">
    <!-- Shadow -->
    <rect x="-10" y="30" width="580" height="230" rx="20" fill="#02050a" opacity="0.8" filter="url(#floorShadow)"/>

    <!-- Foil Main Packet -->
    <rect x="0" y="0" width="580" height="220" rx="16" fill="url(#wrapperFoil)"/>
    <rect x="0" y="0" width="580" height="220" rx="16" fill="url(#foilSheen)"/>
    <rect x="0" y="0" width="580" height="220" rx="16" fill="none" stroke="#2563eb" stroke-width="1.8" opacity="0.6"/>

    <!-- Left Crimped Foil Edge (Zigzag) -->
    <path d="M 0 0 L 16 10 L 0 20 L 16 30 L 0 40 L 16 50 L 0 60 L 16 70 L 0 80 L 16 90 L 0 100 L 16 110 L 0 120 L 16 130 L 0 140 L 16 150 L 0 160 L 16 170 L 0 180 L 16 190 L 0 200 L 16 210 L 0 220 Z" fill="#0f1f3a" stroke="#2563eb" stroke-width="1"/>
    
    <!-- Right Crimped Foil Edge (Zigzag) -->
    <path d="M 580 0 L 564 10 L 580 20 L 564 30 L 580 40 L 564 50 L 580 60 L 564 70 L 580 80 L 564 90 L 580 100 L 564 110 L 580 120 L 564 130 L 580 140 L 564 150 L 580 160 L 564 170 L 580 180 L 564 190 L 580 200 L 564 210 L 580 220 Z" fill="#0f1f3a" stroke="#2563eb" stroke-width="1"/>

    <!-- Foil Graphic Accents -->
    <polygon points="60,20 180,20 120,200 40,200" fill="#2563eb" opacity="0.2"/>
    <line x1="40" y1="26" x2="540" y2="26" stroke="#67e8f9" stroke-width="2" opacity="0.8"/>
    <line x1="40" y1="194" x2="540" y2="194" stroke="#2563eb" stroke-width="2" opacity="0.8"/>

    <!-- WRAPPER BRANDING -->
    <g transform="translate(65, 45)">
      <!-- OMASTRA MONOGRAM -->
      <polygon points="0,-4 18,-4 9,8" fill="#67e8f9"/>
      <polygon points="3,-1 15,-1 9,8" fill="#2563eb"/>
      <text x="32" y="32" font-family="'Anton', sans-serif" font-size="44" letter-spacing="4" fill="#f8fafc">OMASTRA</text>
      <text x="34" y="48" font-family="'Manrope', sans-serif" font-weight="800" font-size="10" letter-spacing="3.5" fill="#67e8f9">PERFORMANCE NUTRITION</text>

      <!-- PRODUCT TITLE -->
      <text x="32" y="86" font-family="'Anton', sans-serif" font-size="28" letter-spacing="1.5" fill="#ffffff">CRUNCHY PROTEIN BAR</text>
      <text x="32" y="104" font-family="'Manrope', sans-serif" font-weight="700" font-size="12" letter-spacing="2" fill="#93c5fd">FUDGE BROWNIE CRUNCH</text>

      <!-- BADGES ON WRAPPER -->
      <g transform="translate(32, 118)">
        <!-- 20G PROTEIN -->
        <rect x="0" y="0" width="82" height="26" rx="4" fill="#091326" stroke="#67e8f9" stroke-width="1.2"/>
        <text x="41" y="18" text-anchor="middle" font-family="'Anton', sans-serif" font-size="14" fill="#67e8f9">20G PROTEIN</text>

        <!-- ZERO ADDED SUGAR -->
        <rect x="90" y="0" width="86" height="26" rx="4" fill="#091326" stroke="#2563eb" stroke-width="1.2"/>
        <text x="133" y="18" text-anchor="middle" font-family="'Anton', sans-serif" font-size="14" fill="#ffffff">&lt;1G SUGAR</text>

        <!-- REAL CRUNCH -->
        <rect x="184" y="0" width="88" height="26" rx="4" fill="#091326" stroke="#2563eb" stroke-width="1.2"/>
        <text x="228" y="18" text-anchor="middle" font-family="'Anton', sans-serif" font-size="14" fill="#cbd5e1">100% CRISP</text>
      </g>
    </g>
  </g>

  <!-- FOREGROUND: REALISTIC 3D GOURMET PROTEIN BAR -->
  <!-- Bar Piece 1: Main Front Bar (unwrapped, angled with rich layered cross-section) -->
  <g id="mainBar" transform="translate(240, 560) rotate(12)">
    <!-- Floor Drop Shadow -->
    <ellipse cx="220" cy="190" rx="240" ry="38" fill="#020408" opacity="0.9" filter="url(#floorShadow)"/>

    <!-- Bar Bottom/Side 3D Thickness Extrusion -->
    <!-- Right Edge 3D -->
    <polygon points="410,30 460,50 460,95 410,75" fill="url(#chocSide)"/>
    <!-- Bottom Face 3D -->
    <polygon points="30,110 410,75 460,95 80,135" fill="url(#chocSide)"/>

    <!-- BAR TOP CHOCOLATE COATING -->
    <polygon points="30,55 370,18 410,30 80,72" fill="url(#chocTop)"/>
    <!-- Specular Highlight edge -->
    <line x1="30" y1="55" x2="370" y2="18" stroke="#ffffff" stroke-width="1.8" opacity="0.25"/>

    <!-- CHOCOLATE DRIZZLES ACROSS TOP SURFACE -->
    <g stroke="url(#drizzleGloss)" stroke-linecap="round" fill="none">
      <path d="M 60 62 Q 90 40 120 48 Q 150 56 180 38" stroke-width="7"/>
      <path d="M 120 54 Q 150 32 180 40 Q 210 48 240 30" stroke-width="8"/>
      <path d="M 180 46 Q 210 24 240 32 Q 270 40 300 22" stroke-width="8"/>
      <path d="M 240 38 Q 270 16 300 24 Q 330 32 360 14" stroke-width="7"/>
    </g>
    <!-- Drizzle glossy specular highlights -->
    <g stroke="#ffffff" stroke-linecap="round" fill="none" opacity="0.35">
      <path d="M 62 60 Q 90 38 118 46" stroke-width="2"/>
      <path d="M 122 52 Q 150 30 178 38" stroke-width="2.2"/>
      <path d="M 182 44 Q 210 22 238 30" stroke-width="2.2"/>
      <path d="M 242 36 Q 270 14 298 22" stroke-width="2"/>
    </g>

    <!-- CRISPY PUFF PEARLS EMBEDDED ON TOP -->
    <g fill="#78350f" stroke="#1c0b05" stroke-width="1">
      <circle cx="95" cy="52" r="5"/>
      <circle cx="140" cy="42" r="6"/>
      <circle cx="160" cy="50" r="5"/>
      <circle cx="210" cy="36" r="6.5"/>
      <circle cx="235" cy="44" r="5.5"/>
      <circle cx="280" cy="28" r="6"/>
      <circle cx="310" cy="32" r="5"/>
      <circle cx="340" cy="22" r="5.5"/>
    </g>
    <!-- Crispy pearl highlights -->
    <g fill="#fde68a" opacity="0.6">
      <circle cx="93" cy="50" r="1.5"/>
      <circle cx="138" cy="40" r="1.8"/>
      <circle cx="208" cy="34" r="2"/>
      <circle cx="278" cy="26" r="1.8"/>
    </g>

    <!-- CROSS-SECTION (Front Break showing internal gourmet layers) -->
    <polygon points="30,55 80,72 80,135 30,110" fill="url(#coreCrossSection)"/>
    <polygon points="30,55 80,72 80,135 30,110" stroke="#1f0a04" stroke-width="1.5" fill="none"/>

    <!-- INTERNAL CARAMEL LAYER -->
    <polygon points="30,62 80,79 80,87 30,70" fill="url(#caramelLayer)"/>
    <!-- Caramel drip on edge -->
    <path d="M 45 70 C 45 76 52 76 52 70" fill="#f59e0b"/>
    <path d="M 68 77 C 68 85 75 85 75 77" fill="#f59e0b"/>

    <!-- INTERNAL CRISPY PROTEIN NUGGETS IN CORE -->
    <g fill="#d97706" opacity="0.85">
      <circle cx="42" cy="92" r="3.5"/>
      <circle cx="56" cy="100" r="4"/>
      <circle cx="68" cy="94" r="3.5"/>
      <circle cx="48" cy="105" r="3"/>
      <circle cx="64" cy="115" r="4"/>
      <circle cx="38" cy="80" r="2.5"/>
    </g>
  </g>

  <!-- Bar Piece 2: Smaller Broken Chunk Resting in Foreground -->
  <g id="chunkPiece" transform="translate(180, 715) rotate(-16)">
    <!-- Shadow -->
    <ellipse cx="60" cy="45" rx="75" ry="18" fill="#020408" opacity="0.9" filter="url(#floorShadow)"/>
    <!-- 3D body -->
    <polygon points="10,25 90,10 115,22 35,38" fill="url(#chocTop)"/>
    <polygon points="35,38 115,22 115,50 35,66" fill="url(#chocSide)"/>
    <polygon points="10,25 35,38 35,66 10,50" fill="url(#coreCrossSection)"/>
    <!-- Caramel & Crispy bits -->
    <polygon points="10,30 35,43 35,48 10,35" fill="url(#caramelLayer)"/>
    <!-- Top Drizzle -->
    <path d="M 25 30 Q 55 18 85 24" stroke="url(#drizzleGloss)" stroke-width="6" stroke-linecap="round" fill="none"/>
    <circle cx="60" cy="22" r="4" fill="#78350f"/>
    <circle cx="59" cy="21" r="1.5" fill="#fde68a" opacity="0.6"/>
  </g>

  <!-- SCATTERED CHOCOLATE SHAVINGS & CRISP PEARLS ON FLOOR -->
  <g fill="#3e1f13">
    <!-- Crumbs near chunk -->
    <circle cx="150" cy="790" r="3.5"/>
    <circle cx="170" cy="815" r="2.5"/>
    <polygon points="210,800 216,796 214,803" fill="#502512"/>
    <polygon points="290,820 298,814 294,824" fill="#2e1308"/>
    <!-- Crispy pearls -->
    <circle cx="330" cy="810" r="5" fill="#92400e"/>
    <circle cx="329" cy="809" r="1.5" fill="#fde68a" opacity="0.7"/>
    <circle cx="620" cy="780" r="4.5" fill="#92400e"/>
    <circle cx="619" cy="779" r="1.5" fill="#fde68a" opacity="0.7"/>
    <circle cx="650" cy="795" r="3" fill="#451a03"/>
  </g>

  <!-- LIGHT FLARES & STUDIO PARTICLES -->
  <circle cx="512" cy="180" r="150" fill="#2563eb" opacity="0.1" filter="url(#floorShadow)"/>
  <circle cx="820" cy="460" r="120" fill="#67e8f9" opacity="0.08" filter="url(#floorShadow)"/>
  <circle cx="220" cy="620" r="140" fill="#2563eb" opacity="0.08" filter="url(#floorShadow)"/>
</svg>
</body>
</html>
