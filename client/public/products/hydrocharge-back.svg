<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <filter id="cardShadow2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="20" stdDeviation="30" flood-opacity="0.1"/>
    </filter>
  </defs>

  <rect width="1000" height="1000" fill="#F8FAFC"/>

  <!-- Card -->
  <rect x="220" y="80" width="560" height="840" rx="20" fill="#FFFFFF" stroke="#000000" stroke-width="2" filter="url(#cardShadow2)"/>

  <!-- Header -->
  <text x="500" y="140" font-family="-apple-system, sans-serif" font-size="28" font-weight="900" letter-spacing="2" fill="#000000" text-anchor="middle">OMASTRA</text>
  <text x="500" y="170" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" letter-spacing="3" fill="#64748B" text-anchor="middle">HYDROCHARGE — SUPPLEMENT FACTS</text>
  <line x1="250" y1="190" x2="750" y2="190" stroke="#000000" stroke-width="8"/>

  <!-- Serving Info -->
  <text x="260" y="220" font-family="-apple-system, sans-serif" font-size="16" font-weight="700" fill="#000000">Serving Size: 1 Scoop (6g)</text>
  <text x="260" y="244" font-family="-apple-system, sans-serif" font-size="15" font-weight="500" fill="#64748B">Servings Per Container: 30</text>
  <line x1="250" y1="260" x2="750" y2="260" stroke="#000000" stroke-width="4"/>

  <!-- Calories -->
  <text x="260" y="295" font-family="-apple-system, sans-serif" font-size="18" font-weight="800" fill="#000000">Calories: 5</text>
  <text x="740" y="295" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" fill="#64748B" text-anchor="end">Total Carbohydrate: 1g</text>
  <line x1="250" y1="315" x2="750" y2="315" stroke="#000000" stroke-width="3"/>

  <!-- Electrolyte Rows -->
  <g font-family="-apple-system, sans-serif" font-size="15">
    <text x="260" y="348" font-weight="800" fill="#000000">Sodium (from Himalayan Pink Salt) 500mg</text>
    <text x="740" y="348" font-weight="700" fill="#000000" text-anchor="end">22%</text>
    <line x1="250" y1="365" x2="750" y2="365" stroke="#E2E8F0" stroke-width="1"/>

    <text x="260" y="398" font-weight="800" fill="#000000">Potassium (as Potassium Citrate) 200mg</text>
    <text x="740" y="398" font-weight="700" fill="#000000" text-anchor="end">4%</text>
    <line x1="250" y1="415" x2="750" y2="415" stroke="#E2E8F0" stroke-width="1"/>

    <text x="260" y="448" font-weight="800" fill="#000000">Magnesium (as Magnesium Bisglycinate) 70mg</text>
    <text x="740" y="448" font-weight="700" fill="#000000" text-anchor="end">17%</text>
    <line x1="250" y1="465" x2="750" y2="465" stroke="#E2E8F0" stroke-width="1"/>

    <text x="260" y="498" font-weight="800" fill="#000000">Calcium (as Calcium Citrate) 60mg</text>
    <text x="740" y="498" font-weight="700" fill="#000000" text-anchor="end">5%</text>
    <line x1="250" y1="515" x2="750" y2="515" stroke="#E2E8F0" stroke-width="1"/>

    <text x="260" y="548" font-weight="800" fill="#000000">Chloride (from Pink Salt) 750mg</text>
    <text x="740" y="548" font-weight="700" fill="#000000" text-anchor="end">33%</text>
    <line x1="250" y1="565" x2="750" y2="565" stroke="#000000" stroke-width="4"/>

    <!-- Botanicals -->
    <text x="260" y="600" font-weight="800" fill="#000000">Organic Freeze-Dried Coconut Water 500mg</text>
    <text x="740" y="600" font-weight="700" fill="#000000" text-anchor="end">*</text>
    <line x1="250" y1="620" x2="750" y2="620" stroke="#E2E8F0" stroke-width="1"/>

    <text x="260" y="648" font-weight="800" fill="#000000">Vitamin C (as Ascorbic Acid) 90mg</text>
    <text x="740" y="648" font-weight="700" fill="#000000" text-anchor="end">100%</text>
    <line x1="250" y1="668" x2="750" y2="668" stroke="#000000" stroke-width="4"/>
  </g>

  <!-- Ingredients Block -->
  <text x="260" y="700" font-family="-apple-system, sans-serif" font-size="12" font-weight="800" fill="#000000">OTHER INGREDIENTS:</text>
  <text x="260" y="722" font-family="-apple-system, sans-serif" font-size="11" font-weight="500" fill="#475569">Citric Acid, Natural Lemon Lime Flavor, Stevia Leaf Extract, Silicon Dioxide.</text>

  <text x="260" y="760" font-family="-apple-system, sans-serif" font-size="12" font-weight="800" fill="#000000">RECOMMENDED USE:</text>
  <text x="260" y="782" font-family="-apple-system, sans-serif" font-size="11" font-weight="500" fill="#475569">Add 1 scoop to 500ml water. Shake vigorously. Drink during intense exercise</text>
  <text x="260" y="800" font-family="-apple-system, sans-serif" font-size="11" font-weight="500" fill="#475569">or in hot conditions to prevent dehydration and muscle cramps.</text>

  <!-- Bottom Badges -->
  <rect x="260" y="845" width="85" height="24" rx="12" fill="#000000"/>
  <text x="302" y="861" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">ZERO SUGAR</text>

  <rect x="355" y="845" width="95" height="24" rx="12" fill="#000000"/>
  <text x="402" y="861" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">KETO FRIENDLY</text>

  <rect x="460" y="845" width="90" height="24" rx="12" fill="#000000"/>
  <text x="505" y="861" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">NON-GMO</text>
</svg>
