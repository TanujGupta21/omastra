  <!-- Callout 3: Top Right -->
  <g transform="translate(680, 160)">
    <circle cx="40" cy="40" r="32" fill="#FFFFFF" stroke="#000000" stroke-width="2" filter="url(#softShadow3)"/>
    <text x="40" y="47" font-family="-apple-system, sans-serif" font-size="18" font-weight="900" fill="#000000" text-anchor="middle">0%</text>
    <text x="88" y="32" font-family="-apple-system, sans-serif" font-size="16" font-weight="800" fill="#000000">ZERO MALTITOL</text>
    <text x="88" y="52" font-family="-apple-system, sans-serif" font-size="12" font-weight="500" fill="#64748B">No Stomach Cramps or Bloat</text>
    <line x1="-10" y1="40" x2="-80" y2="180" stroke="#000000" stroke-width="2" stroke-dasharray="4 4"/>
