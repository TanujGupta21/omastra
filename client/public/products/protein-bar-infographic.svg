    <text x="40" y="47" font-family="-apple-system, sans-serif" font-size="18" font-weight="900" fill="#000000" text-anchor="middle">🍫</text>
    <text x="88" y="32" font-family="-apple-system, sans-serif" font-size="16" font-weight="800" fill="#000000">REAL DARK CHOCOLATE</text>
