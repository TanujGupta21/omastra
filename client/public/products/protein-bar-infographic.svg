  <!-- Bottom Brand Bar -->
  <text x="500" y="930" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" letter-spacing="4" fill="#000000" text-anchor="middle">OMASTRA PROTEIN CRUNCH — MACRO-FRIENDLY SNACKING</text>
