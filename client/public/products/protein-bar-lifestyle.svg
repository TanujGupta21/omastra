<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <radialGradient id="barGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#FDFBF7"/>
      <stop offset="100%" stop-color="#F5ECE0"/>
    </radialGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="24" stdDeviation="30" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="1000" height="1000" fill="url(#barGrad)"/>
  <!-- Marble Cutting Board Surface -->
  <rect y="760" width="1000" height="240" fill="#E6DFD5"/>
  <line x1="0" y1="760" x2="1000" y2="760" stroke="#D8CFC2" stroke-width="2"/>

  <!-- Unwrapped Bar with Crisp Texture Cross-Section Left -->
  <g transform="translate(130, 520)" filter="url(#softShadow)">
    <!-- Unwrapped bar body -->
    <rect x="20" y="80" width="160" height="70" rx="8" fill="#3D2314"/>
    <rect x="20" y="80" width="160" height="12" rx="4" fill="#24140A"/>
    <!-- Crispy protein crisp puffs embedded -->
    <circle cx="50" cy="115" r="7" fill="#EAB308"/>
    <circle cx="75" cy="118" r="8" fill="#FDE047"/>
    <circle cx="105" cy="112" r="7" fill="#EAB308"/>
    <circle cx="130" cy="120" r="8" fill="#FDE047"/>
    <circle cx="60" cy="132" r="6" fill="#FDE047"/>
    <circle cx="90" cy="135" r="7" fill="#EAB308"/>
    <circle cx="120" cy="134" r="6" fill="#FDE047"/>
    <!-- Roasted Peanuts Prop beside bar -->
    <ellipse cx="205" cy="140" rx="14" ry="9" fill="#B45309" transform="rotate(-15 205 140)"/>
    <ellipse cx="218" cy="148" rx="12" ry="8" fill="#92400E" transform="rotate(25 218 148)"/>
    <text x="100" y="195" font-family="-apple-system, sans-serif" font-size="12" font-weight="800" fill="#3E2723" text-anchor="middle">CRISPY TRIPLE LAYER</text>
  </g>

  <!-- Box / Product Packaging Center -->
  <image href="/products/protein-bar.png" x="290" y="140" width="460" height="660" preserveAspectRatio="xMidYMid meet" filter="url(#softShadow)"/>

  <!-- Gym Bag & On-The-Go Prop Right -->
  <g transform="translate(740, 530)">
    <rect width="180" height="150" rx="20" fill="#1E293B" filter="url(#softShadow)"/>
    <path d="M 40,30 C 40,-10 140,-10 140,30" fill="none" stroke="#0F172A" stroke-width="12" stroke-linecap="round"/>
    <rect x="40" y="50" width="100" height="18" rx="9" fill="#334155"/>
    <text x="90" y="105" font-family="-apple-system, sans-serif" font-size="13" font-weight="900" letter-spacing="1" fill="#FFFFFF" text-anchor="middle">ON-THE-GO</text>
    <text x="90" y="125" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#94A3B8" text-anchor="middle">Pocket Fuel</text>
  </g>

  <!-- Top Pill -->
  <rect x="340" y="45" width="320" height="38" rx="19" fill="#000000"/>
  <text x="500" y="69" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" letter-spacing="3" fill="#FFFFFF" text-anchor="middle">EVERYDAY FITNESS SNACKING</text>

  <text x="500" y="940" font-family="-apple-system, sans-serif" font-size="13" font-weight="800" letter-spacing="3" fill="#000000" text-anchor="middle">20g PROTEIN · 3g NET CARBS · ZERO MALTITOL · GUILT-FREE TASTE</text>
</svg>
