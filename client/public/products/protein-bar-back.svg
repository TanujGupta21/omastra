<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <filter id="cardShadow3" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="20" stdDeviation="30" flood-opacity="0.1"/>
    </filter>
  </defs>

  <rect width="1000" height="1000" fill="#F8FAFC"/>

  <!-- Card -->
  <rect x="220" y="80" width="560" height="840" rx="20" fill="#FFFFFF" stroke="#000000" stroke-width="2" filter="url(#cardShadow3)"/>

  <!-- Header -->
  <text x="500" y="140" font-family="-apple-system, sans-serif" font-size="28" font-weight="900" letter-spacing="2" fill="#000000" text-anchor="middle">OMASTRA</text>
  <text x="500" y="170" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" letter-spacing="3" fill="#64748B" text-anchor="middle">PROTEIN CRUNCH BAR — NUTRITION FACTS</text>
  <line x1="250" y1="190" x2="750" y2="190" stroke="#000000" stroke-width="8"/>

  <!-- Serving Info -->
  <text x="260" y="220" font-family="-apple-system, sans-serif" font-size="16" font-weight="700" fill="#000000">Serving Size: 1 Bar (60g)</text>
  <text x="260" y="244" font-family="-apple-system, sans-serif" font-size="15" font-weight="500" fill="#64748B">Servings Per Box: 12 Bars</text>
  <line x1="250" y1="260" x2="750" y2="260" stroke="#000000" stroke-width="4"/>

  <!-- Calories -->
  <text x="260" y="295" font-family="-apple-system, sans-serif" font-size="18" font-weight="800" fill="#000000">Calories: 210</text>
  <text x="740" y="295" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" fill="#64748B" text-anchor="end">Calories from Fat: 72</text>
  <line x1="250" y1="315" x2="750" y2="315" stroke="#000000" stroke-width="3"/>

  <!-- Macro Rows -->
  <g font-family="-apple-system, sans-serif" font-size="15">
    <text x="260" y="348" font-weight="800" fill="#000000">Total Fat 8g</text>
    <text x="740" y="348" font-weight="700" fill="#000000" text-anchor="end">10%</text>
    <line x1="250" y1="365" x2="750" y2="365" stroke="#E2E8F0" stroke-width="1"/>

    <text x="280" y="392" font-weight="500" fill="#64748B">Saturated Fat 2.5g</text>
    <text x="740" y="392" font-weight="600" fill="#64748B" text-anchor="end">13%</text>
    <line x1="250" y1="410" x2="750" y2="410" stroke="#E2E8F0" stroke-width="1"/>

    <text x="260" y="438" font-weight="800" fill="#000000">Total Carbohydrate 15g</text>
    <text x="740" y="438" font-weight="700" fill="#000000" text-anchor="end">5%</text>
    <line x1="250" y1="455" x2="750" y2="455" stroke="#E2E8F0" stroke-width="1"/>

    <text x="280" y="482" font-weight="500" fill="#64748B">Dietary Fiber 10g (Prebiotic)</text>
    <text x="740" y="482" font-weight="600" fill="#64748B" text-anchor="end">36%</text>
    <line x1="250" y1="500" x2="750" y2="500" stroke="#E2E8F0" stroke-width="1"/>

    <text x="280" y="528" font-weight="500" fill="#64748B">Total Sugars 1.5g (Added Sugars 0g)</text>
    <text x="740" y="528" font-weight="600" fill="#64748B" text-anchor="end">0%</text>
    <line x1="250" y1="545" x2="750" y2="545" stroke="#000000" stroke-width="3"/>

    <!-- Protein Big Highlight -->
    <text x="260" y="582" font-weight="900" font-size="18" fill="#000000">PROTEIN 20g</text>
    <text x="740" y="582" font-weight="800" font-size="16" fill="#000000" text-anchor="end">40%</text>
    <line x1="250" y1="602" x2="750" y2="602" stroke="#000000" stroke-width="6"/>

    <text x="260" y="635" font-weight="700" fill="#000000">Sodium 140mg</text>
    <text x="740" y="635" font-weight="700" fill="#000000" text-anchor="end">6%</text>
    <line x1="250" y1="655" x2="750" y2="655" stroke="#E2E8F0" stroke-width="1"/>

    <text x="260" y="682" font-weight="700" fill="#000000">Calcium 180mg</text>
    <text x="740" y="682" font-weight="700" fill="#000000" text-anchor="end">14%</text>
    <line x1="250" y1="702" x2="750" y2="702" stroke="#000000" stroke-width="4"/>
  </g>

  <!-- Ingredients Block -->
  <text x="260" y="735" font-family="-apple-system, sans-serif" font-size="12" font-weight="800" fill="#000000">INGREDIENTS:</text>
  <text x="260" y="755" font-family="-apple-system, sans-serif" font-size="11" font-weight="500" fill="#475569">Whey Protein Isolate, Milk Protein Isolate, Soluble Tapioca Fiber,</text>
  <text x="260" y="773" font-family="-apple-system, sans-serif" font-size="11" font-weight="500" fill="#475569">Roasted Peanuts, Dark Chocolate Coating (Cocoa Butter, Stevia), Sea Salt.</text>

  <text x="260" y="810" font-family="-apple-system, sans-serif" font-size="12" font-weight="800" fill="#000000">ALLERGEN WARNING:</text>
  <text x="260" y="830" font-family="-apple-system, sans-serif" font-size="11" font-weight="500" fill="#475569">Contains Milk, Peanuts. Manufactured in a facility that handles tree nuts.</text>

  <!-- Bottom Badges -->
  <rect x="260" y="865" width="85" height="24" rx="12" fill="#000000"/>
  <text x="302" y="881" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">20g PROTEIN</text>

  <rect x="355" y="865" width="95" height="24" rx="12" fill="#000000"/>
  <text x="402" y="881" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">3g NET CARBS</text>

  <rect x="460" y="865" width="105" height="24" rx="12" fill="#000000"/>
  <text x="512" y="881" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">ZERO MALTITOL</text>
</svg>
